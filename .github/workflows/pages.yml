name: Build and deploy Believe Sign

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Export and validate GitHub Pages site (includes TypeScript)
        run: npm run build:pages
      - name: Validate enquiry message encoding
        run: node scripts/check-quote-message.mjs
      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  # Public launch approved by the owner after local build and browser checks.
  deploy:
    if: github.repository == 'Mukul1991/believe-sign' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy approved website
        id: deployment
        uses: actions/deploy-pages@v4
